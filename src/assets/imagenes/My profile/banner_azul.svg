<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="395" viewBox="0 0 1024 395" fill="none">
  <defs>
    <linearGradient id="blueFill" x1="512" y1="45" x2="512" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D9EEFF"/>
      <stop offset="0.48" stop-color="#B9DEFF"/>
      <stop offset="1" stop-color="#8CCAFF"/>
    </linearGradient>
    <linearGradient id="edge" x1="512" y1="35" x2="512" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64B8FF"/>
      <stop offset="0.52" stop-color="#168FEF"/>
      <stop offset="1" stop-color="#45ADFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="512" y1="65" x2="512" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="4" result="offset"/>
      <feColorMatrix in="offset" type="matrix"
        values="0 0 0 0 0.08
                0 0 0 0 0.48
                0 0 0 0 0.88
                0 0 0 .28 0" result="shadowColor"/>
      <feMerge>
        <feMergeNode in="shadowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main puffy blue banner -->
  <g filter="url(#shadow)">
    <path d="
      M 77 125
      C 55 122, 39 108, 42 91
      C 45 69, 79 62, 120 51
      C 222 23, 364 13, 512 13
      C 660 13, 802 23, 904 51
      C 945 62, 979 69, 982 91
      C 985 108, 969 122, 947 125
      C 979 130, 995 145, 988 164
      C 982 180, 962 185, 935 188
      C 970 192, 986 208, 978 226
      C 972 241, 950 246, 923 251
      C 951 258, 970 274, 963 292
      C 956 312, 926 318, 887 311
      C 773 290, 650 280, 512 280
      C 374 280, 251 290, 137 311
      C 98 318, 68 312, 61 292
      C 54 274, 73 258, 101 251
      C 74 246, 52 241, 46 226
      C 38 208, 54 192, 89 188
      C 62 185, 42 180, 36 164
      C 29 145, 45 130, 77 125
      Z" fill="url(#blueFill)" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Subtle inner highlight along the upper curve -->
    <path d="
      M 77 119
      C 195 54, 355 34, 512 34
      C 669 34, 829 54, 947 119"
      stroke="url(#shine)" stroke-width="13" stroke-linecap="round" opacity=".85"/>

    <!-- Soft central sheen -->
    <path d="
      M 91 139
      C 220 112, 365 103, 512 103
      C 659 103, 804 112, 933 139
      C 816 158, 664 165, 512 165
      C 360 165, 208 158, 91 139 Z"
      fill="#FFFFFF" opacity=".10"/>
  </g>
</svg>
